# Plain-text log sources for porthole: nginx combined access logs + a chatter
# that writes INFO/WARN/ERROR, klog, and logfmt lines (no JSON).
---
apiVersion: v1
kind: Namespace
metadata:
  name: logs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: logs
  labels:
    app: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: logs
spec:
  selector:
    app: nginx
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nginx
  namespace: logs
spec:
  parentRefs:
    - name: eg
      namespace: echo
  hostnames:
    - nginx.local
  rules:
    - backendRefs:
        - name: nginx
          port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatter
  namespace: logs
  labels:
    app: chatter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chatter
  template:
    metadata:
      labels:
        app: chatter
    spec:
      containers:
        - name: chatter
          image: alpine:3.20
          command: ["sh", "-c"]
          args:
            - |
              i=0
              while true; do
                ts=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
                i=$((i+1))
                case $((i % 6)) in
                  0) echo "$ts INFO  worker tick n=$i" ;;
                  1) echo "$ts WARN  cache miss key=user:$i" ;;
                  2) echo "[ERROR] failed to frobnicate widget id=$i" ;;
                  3) echo "I0814 $(date -u +%H:%M:%S).000001       1 main.go:40] starting workers n=$i" ;;
                  4) echo "ts=$ts level=error msg=\"upstream timeout\" method=GET path=/api/orders status=504" ;;
                  5) echo "10.1.0.4 - - [$(date -u +"%d/%b/%Y:%H:%M:%S +0000")] \"GET /index.html HTTP/1.1\" 200 612" ;;
                esac
                sleep 1
              done
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 32Mi
