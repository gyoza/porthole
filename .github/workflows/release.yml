name: release

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  # GITHUB_TOKEN tag pushes do not start a second workflow, so master
  # must tag and attach binaries in this same run.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go test ./...
      - name: version
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --tags origin
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
          elif git describe --exact-match --tags HEAD >/dev/null 2>&1; then
            tag=$(git describe --exact-match --tags HEAD)
          else
            last=$(git tag -l 'v*.*.*' --sort=-v:refname | head -1)
            [ -n "$last" ] || last=v0.0.0
            ver=${last#v}
            a=${ver%%.*}
            rest=${ver#*.}
            b=${rest%%.*}
            c=${rest#*.}
            c=${c%%-*}
            c=$((c + 1))
            tag="v${a}.${b}.${c}"
            git tag "$tag"
            git push origin "$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ver=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: dist
        run: make dist VERSION="${{ steps.ver.outputs.ver }}"
      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.ver.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "$tag" --generate-notes
          fi
